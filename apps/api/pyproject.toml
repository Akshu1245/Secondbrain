[project]
name = "second-brain-api"
version = "0.1.0"
description = "AI-powered second brain — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "yt-dlp>=2024.10.7",
    "trafilatura>=1.12.2",
    "fastembed>=0.4.2",
    "sqlite-vec>=0.1.6",
    "python-multipart>=0.0.12",
    "tldextract>=5.1.2",
    "regex>=2024.9.11",
    "tenacity>=9.0.0",
    "sse-starlette>=2.1.3",
    "pysqlite3-binary>=0.5.4 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
ocr = ["rapidocr-onnxruntime>=1.3.24", "opencv-python-headless>=4.10.0"]
telegram = ["python-telegram-bot>=21.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
